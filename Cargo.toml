[package]
name = "voicewire"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
cxx = "1.0"
cxx-qt = "0.8.1"
cxx-qt-lib = { version = "0.8.1", features = ["qt_gui", "qt_qml"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cxx-qt-build = "0.8.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
